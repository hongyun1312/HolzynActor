<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="emblemTitle emblemDesc">
  <title id="emblemTitle">HolzynActor 全境众生 · 浮生</title>
  <desc id="emblemDesc">外圈刻度代表持续推进的世界时间，内圈代表世界本身，圈中三个高低不同的人形代表众生，其中一人被灯火照亮——表示世界有人活着。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#16233A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2CE7E" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#E8B457" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E8B457" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E9B8A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4E9B8A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="5" y="5" width="230" height="230" rx="48" fill="none" stroke="#2A3A55" stroke-width="1.5"/>

  <!-- 时间刻度环：24 格，代表持续前进的世界时间 -->
  <circle cx="120" cy="120" r="82" fill="none" stroke="#E8B457" stroke-width="5"
          stroke-dasharray="3 18.467" stroke-linecap="round" opacity="0.5"/>

  <!-- 世界 -->
  <circle cx="120" cy="120" r="64" fill="#0E1A2B" stroke="#4E9B8A" stroke-width="1.6" opacity="0.9"/>
  <circle cx="120" cy="120" r="64" fill="url(#sky)"/>
  <circle cx="120" cy="120" r="54" fill="none" stroke="#4E9B8A" stroke-width="1" opacity="0.28"/>

  <!-- 地平线 -->
  <path d="M 68 178 Q 120 190 172 178" fill="none" stroke="#4E9B8A" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- 众生：三个高低不同的人形，中间一人被灯火照亮 -->
  <circle cx="120" cy="126" r="34" fill="url(#lamp)"/>
  <circle cx="92" cy="140" r="6" fill="#EAF0F7" opacity="0.82"/>
  <rect x="83" y="149" width="18" height="24" rx="9" fill="#EAF0F7" opacity="0.72"/>
  <circle cx="120" cy="127" r="7.4" fill="#F2CE7E"/>
  <rect x="110" y="137" width="20" height="36" rx="10" fill="#E8B457"/>
  <circle cx="148" cy="136" r="6.6" fill="#EAF0F7" opacity="0.88"/>
  <rect x="138.5" y="145" width="19" height="28" rx="9.5" fill="#EAF0F7" opacity="0.78"/>
</svg>
