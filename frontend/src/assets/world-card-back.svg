<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" preserveAspectRatio="xMidYMid slice" role="img" aria-label="世界卡片背面">
  <!-- 世界画廊的「预备背面」：没有上传封面的世界统一用这张卡背显示。
       设计口径：深靛蓝底 + 细网格 + 右侧罗盘环 + 左侧星图；左下角留给世界名文字（白字压深底可读）。
       纯装饰、无文字，避免与卡片上的世界名重复。 -->
  <defs>
    <linearGradient id="hz-back-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141d33" />
      <stop offset="0.55" stop-color="#1d2946" />
      <stop offset="1" stop-color="#0e1526" />
    </linearGradient>
    <radialGradient id="hz-back-glow" cx="0.18" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#5d7bd6" stop-opacity="0.42" />
      <stop offset="1" stop-color="#5d7bd6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hz-back-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2cd9d" stop-opacity="0.8" />
      <stop offset="1" stop-color="#8a6f3f" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="hz-back-grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 0H40M0 0V40" fill="none" stroke="#9fb4e0" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="640" height="260" fill="url(#hz-back-bg)" />
  <rect width="640" height="260" fill="url(#hz-back-glow)" />
  <rect width="640" height="260" fill="url(#hz-back-grid)" />

  <!-- 罗盘环 -->
  <g transform="translate(492 128)" fill="none">
    <circle r="96" stroke="#e2cd9d" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="2 8" />
    <circle r="78" stroke="url(#hz-back-ring)" stroke-opacity="0.55" stroke-width="1.4" />
    <circle r="58" stroke="#e2cd9d" stroke-opacity="0.26" stroke-width="1" />
    <path d="M0-78V-64M0 64V78M-78 0H-64M64 0H78" stroke="#e2cd9d" stroke-opacity="0.45" stroke-width="1" />
    <path d="M0-46L10 0L0 46L-10 0Z" fill="#e2cd9d" fill-opacity="0.16" stroke="#f0dfb6" stroke-opacity="0.55" stroke-width="1" />
    <path d="M-46 0L0-10L46 0L0 10Z" fill="#e2cd9d" fill-opacity="0.1" stroke="#f0dfb6" stroke-opacity="0.35" stroke-width="1" />
  </g>

  <!-- 星图：散点 + 连线，落在左侧留白区 -->
  <g stroke="#cbd6ef" stroke-opacity="0.16" stroke-width="0.8" fill="none">
    <path d="M58 58L104 40L140 74L188 54" />
    <path d="M104 40L118 98L154 112L140 74" />
    <path d="M188 54L206 104L154 112" />
  </g>
  <g fill="#e8eefc">
    <circle cx="58" cy="58" r="2.1" opacity="0.8" />
    <circle cx="104" cy="40" r="1.6" opacity="0.65" />
    <circle cx="140" cy="74" r="2.4" opacity="0.85" />
    <circle cx="188" cy="54" r="1.5" opacity="0.6" />
    <circle cx="118" cy="98" r="1.4" opacity="0.55" />
    <circle cx="154" cy="112" r="1.9" opacity="0.7" />
    <circle cx="206" cy="104" r="1.3" opacity="0.5" />
    <circle cx="86" cy="128" r="1.1" opacity="0.4" />
    <circle cx="238" cy="76" r="1.2" opacity="0.45" />
    <circle cx="264" cy="130" r="1" opacity="0.35" />
  </g>

  <rect x="0.5" y="0.5" width="639" height="259" fill="none" stroke="#e2cd9d" stroke-opacity="0.2" />
</svg>
